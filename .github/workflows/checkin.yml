name: Trae Daily Checkin

on:
  schedule:
    - cron: "5 0 * * *"
    - cron: "0 0 1 * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  checkin:
    if: github.event.schedule != '0 0 1 * *'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Checkin
        env:
          TRAE_COOKIE: ${{ secrets.TRAE_COOKIE }}
          FEISHU_WEBHOOK: ${{ secrets.FEISHU_WEBHOOK }}
          FEISHU_SECRET: ${{ secrets.FEISHU_SECRET }}      - name: Checkin
        env:
          TRAE_COOKIE: ${{ secrets.TRAE_COOKIE }}
          FEISHU_WEBHOOK: ${{ secrets.FEISHU_WEBHOOK }}
          FEISHU_SECRET: ${{ secrets.FEISHU_SECRET }}
          FEISHU_APP_ID: ${{ secrets.FEISHU_APP_ID }}        # ← 新增
          FEISHU_APP_SECRET: ${{ secrets.FEISHU_APP_SECRET }}  # ← 新增
          FEISHU_CHAT_ID: ${{ secrets.FEISHU_CHAT_ID }}        # ← 新增
        run: python checkin.py
        run: python checkin.py

  keepalive:
    if: github.event.schedule == '0 0 1 * *' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Touch commit
        run: |
          date -u +"%Y-%m-%dT%H:%M:%SZ" > .keepalive
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .keepalive
          git commit -m "chore: keepalive $(date -u +%Y-%m)" || echo "no changes"
          git push
